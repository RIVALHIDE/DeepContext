databases:
  - name: deepcontext-postgres
    databaseName: deepcontext
    user: deepcontext
    plan: 0.1c-256mb
    ipAllowList: []

envVarGroups:
  - name: deepcontext-secrets
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NEXCONN_API_BASE_URL
        sync: false
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_AREA_CODE
        value: sg
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

services:
  - type: keyvalue
    name: deepcontext-redis
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: pserv
    name: deepcontext-chroma
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile.chroma
    dockerContext: ./backend
    disk:
      name: chroma-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: ANONYMIZED_TELEMETRY
        value: "FALSE"

  - type: web
    name: deepcontext-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - fromGroup: deepcontext-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: deepcontext-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: deepcontext-redis
          property: connectionString
      - key: CHROMA_HOST
        fromService:
          type: pserv
          name: deepcontext-chroma
          property: host
      - key: CHROMA_PORT
        fromService:
          type: pserv
          name: deepcontext-chroma
          property: port
      - key: CHROMA_SSL
        value: "false"
      - key: CHROMA_COLLECTION_NAME
        value: deepcontext_v2
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: HUGGINGFACE_LOCAL_FILES_ONLY
        value: "false"
      - key: RERANK_ENABLED
        value: "false"

  - type: worker
    name: deepcontext-worker
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A celery_worker.app worker --loglevel=info --concurrency=1
    envVars:
      - fromGroup: deepcontext-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: deepcontext-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: deepcontext-redis
          property: connectionString
      - key: CHROMA_HOST
        fromService:
          type: pserv
          name: deepcontext-chroma
          property: host
      - key: CHROMA_PORT
        fromService:
          type: pserv
          name: deepcontext-chroma
          property: port
      - key: CHROMA_SSL
        value: "false"
      - key: CHROMA_COLLECTION_NAME
        value: deepcontext_v2
      - key: HUGGINGFACE_LOCAL_FILES_ONLY
        value: "false"
      - key: RERANK_ENABLED
        value: "false"
