services:
  - type: web
    name: deepcontext-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: VECTOR_STORE_BACKEND
        value: postgres
      - key: CHROMA_COLLECTION_NAME
        value: deepcontext_v2
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: HUGGINGFACE_LOCAL_FILES_ONLY
        value: "true"
      - key: RERANK_ENABLED
        value: "false"
      - key: ACL_ENFORCEMENT_MODE
        value: enforce
      - key: ACL_AUTO_BACKFILL
        value: "false"
      - key: DOCUMENT_VERSION_AUTO_MIGRATION
        value: "false"
      - key: INGEST_EMBED_BATCH_SIZE
        value: "16"
      - key: OCR_PDF_DPI
        value: "130"
      - key: OCR_MAX_IMAGE_DIMENSION
        value: "2048"
      - key: NEXCONN_API_BASE_URL
        sync: false
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_AREA_CODE
        value: sg
